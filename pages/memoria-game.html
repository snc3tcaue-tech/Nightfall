<!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>memorygame</title>
        <link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../assets/css/memoria.css">

    </head>
    <body>

<a href="menu.html" class="btn-voltar">Voltar</a>

    <main class="memoria">

    <h1 class="page-title">
        Jogo da Memória
    </h1>


    <section class="status">

        <p id="faseTela">
    Fase 1 / 3
</p>

        <p>
            Tempo:
            <span id="tempo">0</span>s
        </p>


        <p>
            Tentativas:
            <span id="tentativas">0</span>
        </p>

    </section>


    <div id="tabuleiro"></div>


    <section id="vitoria">

        <a href="ranking.html" class="btn-ranking">
    Ver Ranking
</a>

        <h2>
             Memórias recuperadas!
        </h2>

        <button id="botaoFase">
    Jogar novamente
</button>

    </section>

    
</main>
<div id="modalNome" class="modal-nome" style="display:none;">

    <div class="modal-box">

        <h2>Salvar pontuação</h2>

        <input id="inputNome" placeholder="Seu nome">

        <div class="acoes-modal">

            <button onclick="fecharModalNome()">
                Cancelar
            </button>

            <button onclick="confirmarNome()">
                Salvar
            </button>

        </div>

    </div>

</div>

<script src="../assets/js/ranking.js"></script>
<script src="../assets/js/modal.js"></script>
    <script src="../assets/js/memoria.js"></script>

</body>
    </html>
