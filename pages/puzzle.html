
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nightfall | Puzzle</title>

<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../assets/css/puzzle.css">
</head>

<body>

<header>
    <h1 class="page-title">Visões do Horror</h1>
</header>

<main class="puzzle">

    <section class="status">
        <p id="faseTela">Fase 1 / 3</p>
        <p>Tempo: <span id="tempo">0</span>s</p>
        <p>Movimentos: <span id="movimentos">0</span></p>
    </section>

    <div id="tabuleiro"></div>

   <section id="vitoria" style="display:none;">

    <div class="card-vitoria">

        <button class="fechar-vitoria" onclick="fecharVitoria()">
            ×
        </button>


        <h2>Imagem reconstruída!</h2>


      <button id="botaoFase">
    Jogar novamente
</button>


        <button onclick="abrirRanking()">
            Ver ranking
        </button>


    </div>

</section>

</main>

<script src="../assets/js/ranking.js"></script>
<script src="../assets/js/puzzle.js"></script>

</body>
</html>
